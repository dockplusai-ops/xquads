<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop wallpaper</title>
<!-- The agents' desktop wallpaper (1280×900), drawn by out/wall.js: render.sh screenshots this page. -->
<style>
html, body { margin: 0; overflow: hidden; background: #0e1c22; }
/* The design system's page ground (tokens.css --bg), flat. */
.wall { position: relative; width: 1280px; height: 900px; overflow: hidden; background: #0e1c22; }
/* The logo as the app draws it (packages/ui Logo, components.css .ac-logo): the symbol 1.25em, the name as tall. */
.logo {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 0.195em;
  line-height: 1;
}
.logo svg { display: block; height: 1.25em; flex: none; fill: currentColor; }
.logo .mark { width: 1.25em; }
.logo .word { width: 3.476em; }
</style>
</head>
<body>
<div class="wall"></div>
<script src="out/wall.js"></script>
</body>
</html>
