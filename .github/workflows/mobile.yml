name: Mobile build (EAS)

# Builds the phone app on EAS. Runs only by hand (Actions → Run workflow),
# so builds spend the EAS quota on purpose; skips quietly without the EXPO_TOKEN secret.
# Verification of the app's code (lint, typecheck, unit tests) runs in ci.yml like everything else.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options: [preview, development, production]
        default: preview
      platform:
        description: "Platform"
        type: choice
        options: [all, ios, android]
        default: all
      runner:
        description: "Where it builds: EAS's servers (spends the plan's builds) or this repository's macOS runner (iOS only, free on a public repository, with EAS's credentials)"
        type: choice
        options: [eas, github]
        default: eas

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: inputs.runner != 'github'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Skip without EXPO_TOKEN
        if: env.EXPO_TOKEN == ''
        run: echo "EXPO_TOKEN is not set; skipping the EAS build."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.EXPO_TOKEN != ''
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.EXPO_TOKEN != ''
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        if: env.EXPO_TOKEN != ''
      - uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}
          packager: bun
      # The iOS workflow's App Store Connect key, when set: EAS signs with it in CI (makes or repairs the
      # certificate and profiles) and a production iOS build goes on to TestFlight (eas.json's submit profile).
      - name: App Store Connect key
        if: env.EXPO_TOKEN != ''
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
        run: |
          [ -n "$ASC_API_KEY_P8" ] || exit 0
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "EXPO_ASC_KEY_ID=$ASC_API_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$ASC_API_ISSUER_ID"
            echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "EXPO_APPLE_TEAM_TYPE=$APPLE_TEAM_TYPE"
            echo "ASC_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "ASC_API_KEY_ID=$ASC_API_KEY_ID"
            echo "ASC_API_ISSUER_ID=$ASC_API_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: EAS build
        if: env.EXPO_TOKEN != ''
        working-directory: apps/mobile
        run: |
          submit=""
          if [ "${{ inputs.profile }}" = production ] && [ "${{ inputs.platform }}" = ios ] && [ -n "$EXPO_ASC_API_KEY_PATH" ]; then
            submit="--auto-submit"
          fi
          eas build --profile "${{ inputs.profile || 'preview' }}" --platform "${{ inputs.platform || 'all' }}" --non-interactive --no-wait $submit
      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # iOS on this repository's macOS runner: `eas build --local` with the credentials EAS keeps (a clean Mac holds
  # only that certificate, so Xcode can't pick another one of the same name), then EAS Submit sends the .ipa to
  # TestFlight with the App Store Connect key. Spends no EAS builds.
  ios-github:
    if: inputs.runner == 'github'
    runs-on: ${{ vars.CI_RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_CAPABILITY_SYNC: "1"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Needs EXPO_TOKEN and the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::Set EXPO_TOKEN and the App Store Connect secrets (ASC_API_KEY_P8, ASC_API_KEY_ID, ASC_API_ISSUER_ID)"
            exit 1
          fi
          if [ "${{ inputs.platform }}" != ios ]; then
            echo "::error::The GitHub runner builds iOS only: pick platform = ios"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: bun install --frozen-lockfile
      - uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}
          packager: bun
      - name: App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "ASC_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "ASC_API_KEY_ID=$ASC_API_KEY_ID"
            echo "ASC_API_ISSUER_ID=$ASC_API_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Build (local, with EAS credentials)
        working-directory: apps/mobile
        run: eas build --local --platform ios --profile "${{ inputs.profile }}" --non-interactive --output "$RUNNER_TEMP/xquads.ipa"
      - name: Send to TestFlight
        if: inputs.profile == 'production'
        working-directory: apps/mobile
        run: eas submit --platform ios --profile production --path "$RUNNER_TEMP/xquads.ipa" --non-interactive --wait
      # No .ipa artifact: on a public repository anyone signed in could download it. TestFlight is where it goes.
      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
